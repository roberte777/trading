# Annotated reference for a strategy config. Copy to configs/strategies/<name>.yaml.
# One file drives both `trader backtest` and `trader live`, so the two can't drift.

strategy: sixty_forty          # registry name (see `trader list`)
params: {}                     # overrides of the strategy's Params; defaults = published values

execution:                     # shared by backtest AND live
  mode: next_open              # next_open (market-on-open) | next_close (market-on-close)
  delay: 1                     # sessions between the signal close and the fill
  fractional: false            # whole shares (Alpaca OPG/CLS orders cannot be fractional)
  rebalance_band: 0.0          # skip weight changes smaller than this (entries/exits always trade)
  min_order_value: 1.0         # skip orders smaller than $1
  cash_buffer: 0.0             # keep this fraction of equity in cash when sizing
  max_gross: 1.0               # gross exposure cap (1.0 = no leverage)
  allow_short: false

data:
  provider: yahoo              # yahoo (free, long history) | alpaca (needs keys, 2016+)
  cache_dir: default           # $TRADER_CACHE_DIR or ~/.cache/trader
  use_proxies: true            # extend ETF history backwards with older mutual funds / indices
  proxies: {}                  # extra or overriding proxies, e.g. {TLT: VUSTX}
  offline: false               # only read the cache

backtest:
  start: 2000-01-03            # null = first fully warmed-up session
  end: null                    # null = latest data
  initial_capital: 100000
  costs:
    slippage_bps: 5            # adverse fill vs official open/close (half-spread + impact)
    commission_per_share: 0.0  # Alpaca: commission-free US equities via API
    sec_fee_rate: 0.0000206    # SEC Section 31: $20.60 per $1M sold (since 2026-04-04)
    taf_per_share: 0.000195    # FINRA TAF, $ per share sold
    taf_max: 9.79              # TAF cap per trade
    cat_per_share: 0.000003    # Consolidated Audit Trail, buys and sells
  cash_interest: false         # Alpaca cash earns nothing; hold BIL for T-bill returns
  margin_rate: 0.07
  initial_rebalance: true
  benchmark: SPY

live:
  broker: alpaca               # alpaca | local (file-backed simulated account, no keys needed)
  paper: true                  # paper endpoint; real money also needs ALPACA_PAPER=false + TRADER_ALLOW_LIVE=yes
  dry_run: false               # log orders, submit nothing
  instance_id: null            # default = strategy name; prefixes client order ids and state folder
  account_mode: dedicated      # dedicated (own account) | shared (several containers, one account)
  allocation: null             # shared mode: dollars assigned to this strategy's ledger
  capital_fraction: 1.0        # dedicated mode: fraction of account equity to use
  order_style: market          # market (day orders queued pre-open) | auction (opg/cls; Elite accounts)
  data_provider: yahoo         # yahoo (same data as the backtest) | alpaca
  run_at: null                 # NY time; default 08:45 (next_open) or close-25m (next_close)
  retry_after_open_minutes: 5  # retry pre-open rejections (e.g. wash-trade guard) after the open
  initial_rebalance: true      # trade to targets on first deployment
  state_dir: state             # overridden by TRADER_STATE_DIR (/state in Docker)
  max_turnover: 2.2            # abort a rebalance trading more than 2.2x equity
  foreign_positions: ignore    # ignore | fail when a dedicated account holds other symbols
