[project]
name = "trader"
version = "0.1.0"
description = "Daily-bar algorithmic trading harness: backtesting, strategy comparison, and Alpaca live execution"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alpaca-py>=0.40",
    "exchange-calendars>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scipy>=1.12",
    "yfinance>=0.2.54",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
